name: Deploy OCI Alternative

on:
  workflow_dispatch:

concurrency:
  group: oci-alternative-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: |
          node --test tests/*.test.js
          npm run build

      - name: Configure SSH
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/oci_deploy
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/oci_deploy ~/.ssh/known_hosts

      - name: Upload release with unchanged files hard-linked
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          remote="$OCI_USER@$OCI_HOST"
          staging="/tmp/mimic-dice-$RELEASE_ID"
          ssh -i ~/.ssh/oci_deploy "$remote" "test ! -e '$staging' && mkdir -p '$staging/dist'"
          link_dest=""
          if ssh -i ~/.ssh/oci_deploy "$remote" 'test -d /opt/mimic-dice/current/dist'; then
            link_dest="--link-dest=/opt/mimic-dice/current/dist/"
          fi
          rsync -a --delete $link_dest -e 'ssh -i ~/.ssh/oci_deploy' dist/ "$remote:$staging/dist/"
          rsync -az -e 'ssh -i ~/.ssh/oci_deploy' package.json package-lock.json .env.oci.example "$remote:$staging/"
          rsync -az -e 'ssh -i ~/.ssh/oci_deploy' server functions src workers deploy scripts "$remote:$staging/"
          ssh -i ~/.ssh/oci_deploy "$remote" "sudo mv '$staging' '/opt/mimic-dice/releases/$RELEASE_ID' && sudo bash '/opt/mimic-dice/releases/$RELEASE_ID/deploy/oci/activate-release.sh' '/opt/mimic-dice/releases/$RELEASE_ID'"

      - name: Verify deployment
        env:
          ALTERNATIVE_ORIGIN: ${{ secrets.ALTERNATIVE_ORIGIN }}
        run: node scripts/verify-alternative-runtime.mjs "$ALTERNATIVE_ORIGIN"
