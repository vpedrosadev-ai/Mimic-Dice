name: Deploy Cloudflare Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 467b2092c3e0ae03fa136669c4ebcae9

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Build production app
        run: npm run build

      - name: Deploy D1, Monsters League, and Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.148.0"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: |
            d1 migrations apply mimic-dice-production --remote
            deploy --config workers/monsters-league/wrangler.toml
            pages deploy dist --project-name=mimicdice --branch=main
